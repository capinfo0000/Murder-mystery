name: CI

# ビルド・型検査・Lint に加え、シナリオ整合ハーネス（可解性・因果・在室・時系列・
# 物理/毒/血の整合など25＋の不変条件）を毎push/PRで自動実行し、事件ロジックの
# 抜け漏れ・矛盾がマージされるのを防ぐ。
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (tsc + vite)
        run: npm run build
      - name: Scenario consistency harness (8000 scenarios)
        run: npm run check
